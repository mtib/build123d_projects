name: Build STLs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the workflow can create/update a release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cadquery-ocp (OpenCascade) needs a couple of system libs at import time.
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libgl1 libx11-6

      - name: Install Python deps
        # requirements-dev.txt adds matplotlib, needed to render the hero PNGs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build all projects and collect release assets
        # --hero renders a showcase PNG per model; --dist collects STLs + hero
        # PNGs into dist/ as <project>_<file> (path-derived prefix, hard error on
        # any name collision). --views (local-only slice renders) is not passed.
        run: |
          python build_all.py --hero --dist dist
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: STL build ${{ github.run_number }}
          body: >-
            Auto-generated STL files (+ hero renders) from commit ${{ github.sha }}.
          files: |
            dist/*.stl
            dist/*.png
